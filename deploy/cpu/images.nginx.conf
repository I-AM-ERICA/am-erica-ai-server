# Optional nginx on the AI host. Replace the domain/certificate paths before enabling.
# POSTER_PUBLIC_BASE_URL=https://images.example.com
server {
    listen 443 ssl;
    server_name images.example.com;
    ssl_certificate /etc/letsencrypt/live/images.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/images.example.com/privkey.pem;

    location /images/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location / { return 404; }
}
