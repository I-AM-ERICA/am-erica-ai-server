[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrable"
version = "0.1.0"
description = "Feedback-driven customer review response prompt optimization with RAG"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "requests>=2.32,<3", "tqdm>=4.66,<5",
  "rank-bm25>=0.2.2,<0.3", "tiktoken>=0.8,<1",
  "langchain-text-splitters>=0.3,<2", "pypdf>=5,<7",
]

[project.optional-dependencies]
local = ["torch>=2.6,<3", "transformers>=4.51,<5", "accelerate>=1.2,<2", "sentence-transformers>=3.4,<6"]
api = ["openai>=1.68,<3"]
anthropic = ["anthropic>=2.9,<3"]
# Stage 2 LoRA DPO. DPO loss is in scrable/dpo.py; TRL is not needed.
dpo = ["peft>=0.17,<1"]
# gRPC server for the backend (python -m scrable.serve)
serve = ["grpcio>=1.66,<2", "grpcio-tools>=1.66,<2", "grpcio-health-checking>=1.66,<2", "peft>=0.17,<1"]
azure = ["azure-search-documents>=11.6,<12", "openai>=1.68,<3"]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "pandas>=2.2,<3", "matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "nbformat>=5,<6", "nbclient>=0.10,<1", "ruff>=0.11,<1"]

[project.scripts]
scrable-train = "scrable.experiment:main"

[tool.setuptools.packages.find]
include = ["scrable*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
